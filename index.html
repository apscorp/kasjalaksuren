<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Kas RT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .badge-masuk { background-color: #d1e7dd; color: #0f5132; font-weight: 600; }
    .badge-keluar { background-color: #f8d7da; color: #842029; font-weight: 600; }
    .card-custom { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="container" style="max-width: 900px;">
  <h3 class="mb-4 text-center fw-bold">Sistem Keuangan Kas RT</h3>

  <!-- Form Transaksi -->
  <div class="card card-custom p-4 mb-4 bg-white">
    <h5 class="fw-bold mb-3">Tambah Transaksi / Iuran</h5>
    <form id="formTransaksi">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tanggal</label>
          <input type="date" id="inputTanggal" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Jenis</label>
          <select id="inputJenis" class="form-control" onchange="toggleFormType()">
            <option value="masuk">MASUK</option>
            <option value="keluar">KELUAR</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Kategori</label>
          <select id="inputKategori" class="form-control">
            <option value="Iuran">Iuran Warga</option>
            <option value="Lain-lain">Lain-lain</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Nama / Keterangan</label>
          <input type="text" id="inputNama" class="form-control" placeholder="Contoh: Alif Iqbal Firmansyah R1 No.1" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Nominal (per Bulan)</label>
          <input type="number" id="inputNominal" class="form-control" placeholder="150000" required>
        </div>
        <div class="col-md-12" id="boxBulanMulti">
          <label class="form-label">Pilih Jumlah Bulan Pembayaran</label>
          <select id="inputJumlahBulan" class="form-control">
            <option value="1">1 Bulan</option>
            <option value="2">2 Bulan</option>
            <option value="3">3 Bulan</option>
            <option value="4">4 Bulan</option>
            <option value="5">5 Bulan</option>
            <option value="6">6 Bulan</option>
            <option value="12">12 Bulan (1 Tahun)</option>
          </select>
        </div>
        <div class="col-12 mt-3">
          <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnSubmit">Simpan Transaksi</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Tabel Data -->
  <div class="card card-custom p-4 bg-white">
    <h5 class="fw-bold mb-3">Riwayat Transaksi</h5>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Jenis</th>
            <th>Nama / Detail</th>
            <th class="text-end">Nominal</th>
            <th class="text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelBody">
          <!-- Data dari backend/JS akan dirender di sini -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Ganti dengan URL Web App Google Apps Script Anda jika menggunakan backend Apps Script
  const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA"; 

  // Set default tanggal hari ini
  document.getElementById('inputTanggal').valueAsDate = new Date();

  function formatTanggalIndo(dateString) {
    const date = new Date(dateString);
    if (isNaN(date)) return dateString;
    const bulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    return `${date.getDate()} ${bulan[date.getMonth()]} ${date.getFullYear()}`;
  }

  function toggleFormType() {
    const jenis = document.getElementById('inputJenis').value;
    const boxBulan = document.getElementById('boxBulanMulti');
    if (jenis === 'keluar') {
      boxBulan.style.display = 'none';
    } else {
      boxBulan.style.display = 'block';
    }
  }

  document.getElementById('formTransaksi').addEventListener('submit', function(e) {
    e.preventDefault();

    const tglInput = document.getElementById('inputTanggal').value;
    const jenis = document.getElementById('inputJenis').value;
    const kategori = document.getElementById('inputKategori').value;
    const nama = document.getElementById('inputNama').value;
    const nominal = parseFloat(document.getElementById('inputNominal').value);
    const jumlahBulan = parseInt(document.getElementById('inputJumlahBulan').value) || 1;

    // TANGGAL TETAP SAMA: Menggunakan tglInput secara langsung tanpa penambahan bulan (.setMonth)
    const tglFormatted = formatTanggalIndo(tglInput);

    let listTransaksiNew = [];

    if (jenis === 'masuk' && kategori === 'Iuran') {
      for (let i = 0; i < jumlahBulan; i++) {
        listTransaksiNew.push({
          tanggal: tglFormatted, // Tanggal dikunci sesuai tanggal input (misal: 22 Agu 2026)
          jenis: 'MASUK',
          nama: nama,
          nominal: nominal,
          kategori: kategori
        });
      }
    } else {
      listTransaksiNew.push({
        tanggal: tglFormatted,
        jenis: jenis.toUpperCase(),
        nama: nama,
        nominal: nominal,
        kategori: kategori
      });
    }

    // Eksekusi Simpan Data
    simpanKeDatabase(listTransaksiNew);
  });

  function simpanKeDatabase(dataArray) {
    // Jika terhubung ke Google Apps Script:
    dataArray.forEach(data => {
      if (SCRIPT_URL && SCRIPT_URL !== "URL_GOOGLE_APPS_SCRIPT_ANDA") {
        fetch(`${SCRIPT_URL}?action=addRow&tanggal=${encodeURIComponent(data.tanggal)}&jenis=${data.jenis}&nama=${encodeURIComponent(data.nama)}&nominal=${data.nominal}&kategori=${data.kategori}`)
          .then(res => res.json())
          .then(() => renderTabel());
      } else {
        // Jika render lokal/testing UI saja:
        tambahBarisKeTabel(data);
      }
    });

    document.getElementById('formTransaksi').reset();
    document.getElementById('inputTanggal').valueAsDate = new Date();
  }

  function tambahBarisKeTabel(data) {
    const tbody = document.getElementById('tabelBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${data.tanggal}</td>
      <td><span class="badge ${data.jenis === 'MASUK' ? 'badge-masuk' : 'badge-keluar'}">${data.jenis}</span></td>
      <td class="fw-bold">${data.nama}</td>
      <td class="text-end">Rp ${data.nominal.toLocaleString('id-ID')}</td>
      <td class="text-center"><button class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">Hapus</button></td>
    `;
    tbody.appendChild(tr);
  }

  function renderTabel() {
    // Fungsi re-fetch data jika terhubung dengan Apps Script
  }
</script>
</body>
</html>
